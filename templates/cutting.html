{% extends 'layout.html' %}

{% block content %}
<h1>Cutting Department</h1>

<div class="card">
    <div class="card-header bg-primary text-white">
        <div class="d-flex justify-content-between align-items-center">
            <h5 class="mb-0">Detailed Cut List</h5>
            <form method="get" action="{{ url_for('cutting') }}" class="d-flex align-items-center">
                <label for="colorFilter" class="me-2 text-white">Filter by Color:</label>
                <select name="color" id="colorFilter" class="form-select form-select-sm" onchange="this.form.submit()"
                    style="width: auto;">
                    <option value="ALL" {% if selected_color=='ALL' %}selected{% endif %}>All Colors</option>
                    {% for color in available_colors %}
                    <option value="{{ color }}" {% if selected_color==color %}selected{% endif %}>{{ color }}</option>
                    {% endfor %}
                </select>
                <!-- Add a noscript button for accessibility/fallback -->
                <noscript>
                    <button type="submit" class="btn btn-sm btn-light ms-2">Filter</button>
                </noscript>
            </form>
        </div>
    </div>
    <div class="card-body p-0">
        <table class="table table-striped table-hover mb-0">
            <thead>
                <tr>
                    <th>Panel Name</th>
                    <th>Color</th>
                    <th>File</th>
                    <th>Quantity</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                {% for item in cut_items %}
                <tr>
                    <td>{{ item.panel_name }}</td>
                    <td>{{ item.color }}</td>
                    <td><code>{{ item.file_path }}</code></td>
                    <td>
                        <span class="badge bg-warning text-dark fs-6">{{ item.quantity }}</span>
                    </td>
                    <td>
                        <!-- TODO: Implement granular "Mark Done" for panels. 
                             For now, we don't have a specific route for marking single cut items done 
                             in the implementation plan, so we might need to add one or reuse/stub it. 
                             The backend update mentioned 'add_cut_item' but not 'mark_cut_item_done'.
                             Let's assume we'll add /api/mark_cut_item/<id> logic next.
                        -->
                        <button class="btn btn-sm btn-success" disabled>Done</button>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="5" class="text-center text-muted">No items in queue.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
