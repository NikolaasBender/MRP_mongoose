{% extends 'layout.html' %}

{% block content %}
<h1>Sewing Department</h1>

<div class="table-responsive">
    <table class="table table-striped table-hover">
        <thead class="table-dark">
            <tr>
                <th>Job ID</th>
                <th>SKU</th>
                <th>Batch ID</th>
                <th>Created At</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for job in jobs %}
            <tr>
                <td>{{ job.job_id }}</td>
                <td>{{ job.sku }}</td>
                <td>{{ job.batch_id }}</td>
                <td>{{ job.created_at }}</td>
                <td>
                    <form action="{{ url_for('mark_sewn', job_id=job.job_id) }}" method="POST">
                        <button type="submit" class="btn btn-success btn-sm">Mark Complete</button>
                    </form>
                </td>
            </tr>
            {% else %}
            <tr>
                <td colspan="5" class="text-center">No jobs ready for sewing.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
